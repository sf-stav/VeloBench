# Builds release binaries for all four supported platforms and attaches them
# to a GitHub release. Triggered by pushing a tag:  git tag v0.1.0 && git push --tags
#
# Artifacts (what install.sh downloads):
#   velobenchmark-linux-x86_64.tar.gz
#   velobenchmark-linux-arm64.tar.gz
#   velobenchmark-macos-x86_64.tar.gz
#   velobenchmark-macos-arm64.tar.gz

name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.runs-on }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: linux-x86_64, runs-on: ubuntu-latest,   node-arch: x64 }
          - { name: linux-arm64,  runs-on: ubuntu-24.04-arm, node-arch: arm64 }
          - { name: macos-x86_64, runs-on: macos-13,        node-arch: x64 }
          - { name: macos-arm64,  runs-on: macos-14,        node-arch: arm64 }
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          architecture: ${{ matrix.node-arch }}

      - uses: dtolnay/rust-toolchain@stable

      - name: Install protoc
        uses: arduino/setup-protoc@v3
        with:
          version: "25.3"
          repo-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Build frontend
        run: |
          npm --prefix frontend install --no-audit --no-fund
          bash scripts/build-frontend.sh

      - name: Build server
        run: cargo build --release --bin velobench

      - name: Package
        run: |
          stage=$(mktemp -d)
          cp target/release/velobench "$stage/velobench"
          mkdir -p dist
          tar -C "$stage" -czf "dist/velobenchmark-${{ matrix.name }}.tar.gz" velobench
          ( cd dist && shasum -a 256 "velobenchmark-${{ matrix.name }}.tar.gz" > "velobenchmark-${{ matrix.name }}.tar.gz.sha256" )

      - uses: actions/upload-artifact@v4
        with:
          name: velobenchmark-${{ matrix.name }}
          path: dist/*

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          merge-multiple: true
          path: dist

      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
