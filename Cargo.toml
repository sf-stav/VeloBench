[package]
name = "velobench"
version = "0.4.0"
edition = "2021"
description = "VeloBench — LLM live-stats benchmarking and chat console"
license = "MIT"

[[bin]]
name = "velobench"
path = "src/main.rs"

# Offline harness: classifies a JSON dump of section texts with the free-tier
# classifier so scripts can diff Rust labels against the Python validator.
# Usage: cargo run --release --features parity-harness --bin parity -- dump.json > labels.json
#
# Gated behind `parity-harness` because src/bin/ is not synced to the public
# repo. Without the gate, a plain `cargo build` / `cargo test` there fails with
# "couldn't read `src/bin/parity.rs`" — cargo compiles every declared bin.
[[bin]]
name = "parity"
path = "src/bin/parity.rs"
required-features = ["parity-harness"]

[features]
# Dev-only classifier parity harness (src/bin/). The source is not synced to the
# public repo, so this bin is gated off by default: without the feature cargo
# never builds the target and a missing source file is not an error.
parity-harness = []

[dependencies]
axum = { version = "0.8", features = ["ws"] }
tokio = { version = "1", features = ["full"] }
tokio-stream = { version = "0.1", features = ["net"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
clap = { version = "4", features = ["derive"] }
include_dir = "0.7"
reqwest = { version = "0.12", default-features = false, features = ["json", "stream", "gzip", "brotli", "http2", "rustls-tls"] }
tokenizers = { version = "0.21", default-features = false, features = ["onig"] }
uuid = { version = "1", features = ["v4", "serde"] }
# `default-features = false` drops the `clock` feature, which pulls in
# iana-time-zone -> core-foundation-sys. We only need the `now` feature
# (`now = ["std"]`), which backs `Utc::now()` with SystemTime — no timezone
# database, and we never use `chrono::Local`. Keeping `clock` costs a
# `-framework CoreFoundation` link requirement, which blocks cross-compiling
# to macOS from Linux.
chrono = { version = "0.4", default-features = false, features = ["std", "serde", "now"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
futures = "0.3"
base64 = "0.22"
async-stream = "0.3"
anyhow = "1"
prost = "0.13"
tree-sitter = "0.27.0"
tree-sitter-python = "0.25.0"
tree-sitter-javascript = "0.25.0"
tree-sitter-typescript = "0.23.2"
tree-sitter-rust = "0.24.2"
tree-sitter-go = "0.25.0"
tree-sitter-java = "0.23.5"
tree-sitter-c = "0.24.2"
tree-sitter-cpp = "0.23.4"
tree-sitter-json = "0.24.8"
tree-sitter-yaml = "0.7.2"
tree-sitter-bash = "0.25.1"
tree-sitter-html = "0.23.2"
tree-sitter-css = "0.25.0"
regex = "1.13.1"
rusqlite = { version = "0.32", features = ["bundled"] }

[build-dependencies]
prost-build = "0.13"

[profile.release]
lto = true
codegen-units = 1
opt-level = 3
